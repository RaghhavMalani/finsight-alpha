<title>FinSight Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one thin chrome bar, one page column (max 1360px). One surface level: cards on black, dividers inside, never cards in cards.
   Type: Inter for words, JetBrains Mono only for numbers, ids and hashes. Uppercase only for table column headers. */
:root{
  color-scheme:dark;
  --bg:#050607;
  --chrome:#08090B;
  --panel:#0B0D10;
  --raised:#11141A;
  --line:#1A1E23;
  --line-2:#262B31;
  --fg:#E7EAEC;
  --muted:#A3ABB2;
  --faint:#6C757D;
  --amber:#F0A929;
  --amber-dim:rgba(240,169,41,.12);
  --pass:#42C98B;
  --fail:#F06464;
  --warn:#E8B54A;
  --info:#5CA9E6;
  --luna:#39E6B5; --sol:#F0A929; --terra:#6AA8FF;
  --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* chrome */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:24px;height:52px;padding:0 24px;background:rgba(8,9,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none}
.brand .mark{width:22px;height:22px;border:1px solid var(--amber);color:var(--amber);display:grid;place-items:center;font:500 11px var(--font-mono)}
.brand b{font-weight:600}
.brand span{color:var(--faint)}
nav.main{display:flex;gap:2px;height:100%;overflow-x:auto;scrollbar-width:none;min-width:0}
nav.main a{display:flex;align-items:center;padding:0 12px;height:100%;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;border-bottom:1px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--fg)}
nav.main a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--amber)}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.kbd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:none;border-radius:4px;padding:4px 10px;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap}
.kbd:hover{color:var(--fg);border-color:var(--faint)}
.kbd kbd{font:11px var(--font-mono);color:var(--faint)}

/* page */
main{max-width:1360px;margin:0 auto;padding:28px 28px 64px;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ph h1{margin:0;font:600 22px/1.25 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--muted);max-width:72ch}
.prov{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;color:var(--muted);background:none;cursor:pointer;white-space:nowrap}
.prov:hover{border-color:var(--faint);color:var(--fg)}
.prov .ok{width:14px;height:14px;border-radius:50%;background:rgba(66,201,139,.15);color:var(--pass);display:grid;place-items:center;font-size:10px}
.prov .mono{color:var(--faint);font-size:11.5px}

.grid{display:grid;gap:20px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:16px 20px 0}
.ch h2{margin:0;font:600 14px/1.3 var(--font-ui)}
.ch .meta{color:var(--faint);font-size:12.5px}
.cb{padding:16px 20px 20px}
.cf{padding:12px 20px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.link{color:var(--amber);text-decoration:none;font-weight:500;font-size:12.5px;background:none;border:0;padding:0;cursor:pointer}
.link:hover{text-decoration:underline}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font:500 28px/1.15 var(--font-mono);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--faint);margin-left:4px;letter-spacing:0}
.kpi .s{color:var(--faint);font-size:12.5px;margin-top:4px}

/* badges */
.b{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b.pass{color:var(--pass)} .b.fail{color:var(--fail)} .b.warn{color:var(--warn)} .b.neutral{color:var(--muted)} .b.info{color:var(--info)}
.v-pill{display:inline-block;font:500 11px/1 var(--font-mono);letter-spacing:.04em;padding:4px 7px;border-radius:3px;background:var(--raised);color:var(--muted)}
.v-pill.accept{color:var(--pass);background:rgba(66,201,139,.1)}
.v-pill.reject{color:#F59A9A;background:rgba(240,100,100,.1)}
.v-pill.abstain{color:var(--warn);background:rgba(232,181,74,.1)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:0}

/* outcome matrix */
.mx{width:100%;border-collapse:collapse}
.mx th{font:500 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 12px 10px 0;white-space:nowrap}
.mx td{border-top:1px solid var(--line);padding:12px 12px 12px 0;vertical-align:middle}
.mx .task b{display:block;font-weight:500}
.mx .task span{color:var(--faint);font-size:12.5px}
.seeds{display:flex;gap:6px;align-items:center}
.seed{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font:500 10px var(--font-mono);border:0;cursor:pointer;padding:0}
.seed.ok{background:rgba(66,201,139,.16);color:var(--pass)}
.seed.part{background:rgba(232,181,74,.16);color:var(--warn)}
.seed.bad{background:rgba(240,100,100,.18);color:var(--fail)}
.seed:hover{outline:1px solid currentColor}
.legend-row{display:flex;gap:18px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* issues list */
.issues{display:flex;flex-direction:column}
.issue{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.issue:first-child{border-top:0;padding-top:0}
.issue .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.issue .t b{font-weight:500}
.issue .n{font:500 20px var(--font-mono);color:var(--fg)}
.issue p{margin:0;color:var(--muted);font-size:12.5px}
.issue .link{justify-self:start;margin-top:4px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:720px}
table.t th{font:500 11px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:rgba(255,255,255,.02)}
table.t tbody tr[aria-selected="true"] td{background:var(--amber-dim)}
.hb{display:inline-block;height:6px;border-radius:1px;vertical-align:1px;margin-right:8px;background:var(--line-2)}
.hb i{display:block;height:100%;border-radius:1px}
.sub{color:var(--faint);font-size:12px}

/* ladder */
.ladder{position:relative}
.ladder svg{display:block;width:100%;height:auto;overflow:visible}
.ladder-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.ladder-meta > div{padding:14px 20px;border-left:1px solid var(--line)}
.ladder-meta > div:first-child{border-left:0}
.ladder-meta .l{color:var(--muted);font-size:12.5px}
.ladder-meta .v{font:500 18px var(--font-mono);margin-top:4px}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;color:var(--muted);font-size:12.5px;cursor:pointer;border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.inp{background:var(--bg);border:1px solid var(--line-2);border-radius:5px;padding:5px 10px;font-size:12.5px;min-width:0}
.inp:focus{border-color:var(--faint);outline:none}
.count{margin-left:auto;color:var(--faint);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line-2);z-index:41;transform:translateX(100%);transition:transform .25s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h3{margin:0;font:600 16px var(--font-ui)}
.dh .sub{margin-top:3px}
.db{padding:20px 22px 32px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.sect h4{margin:0 0 10px;font:600 12.5px var(--font-ui);color:var(--muted)}
.quote{margin:0;padding:12px 14px;background:var(--bg);border-radius:4px;border-left:2px solid var(--line-2);color:var(--fg);font-size:13px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0;position:relative}
.steps li::before{content:"";position:absolute;left:11px;top:28px;bottom:-8px;width:1px;background:var(--line-2)}
.steps li:last-child::before{display:none}
.steps .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:500 10.5px var(--font-mono);color:var(--muted);background:var(--panel);position:relative;z-index:1}
.steps .act{font-weight:500}
.steps .act small{display:block;color:var(--faint);font:11.5px var(--font-mono);margin-top:2px}
.steps .num{font:12px var(--font-mono);color:var(--muted);text-align:right;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.checks div{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.checks i{font-style:normal;width:16px;text-align:center}
.checks .y i{color:var(--pass)} .checks .n{color:var(--fg)} .checks .n i{color:var(--fail)}
.ids{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:12.5px}
.ids dt{color:var(--faint)} .ids dd{margin:0;font:11.5px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{background:none;border:1px solid var(--line-2);border-radius:3px;color:var(--faint);font-size:11px;padding:1px 6px;cursor:pointer}
.copy:hover{color:var(--fg)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}

/* palette */
.pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0;background:rgba(0,0,0,.55)}
.pal.open{display:flex}
.pal-box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pal-box input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:14px;outline:none}
.pal-list{max-height:340px;overflow:auto;padding:6px}
.pal-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:5px;cursor:pointer;color:var(--fg);font-size:13px}
.pal-list button span{color:var(--faint);font-size:12px}
.pal-list button[aria-selected="true"]{background:var(--raised)}

.note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:12.5px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:5px}
.note b{color:var(--fg);font-weight:500}
.empty-inline{color:var(--faint)}
.foot{color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}

@media (max-width:1100px){.g-2-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .bar{gap:12px;padding:0 16px}
  .brand span{display:none}
  .kbd .lbl{display:none}
  main{padding:20px 16px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .g-1-1{grid-template-columns:minmax(0,1fr)}
  .ladder-meta{grid-template-columns:minmax(0,1fr)}
  .ladder-meta > div{border-left:0;border-top:1px solid var(--line)}
  .ladder-meta > div:first-child{border-top:0}
  .seeds{gap:3px}
  .seed{width:18px;height:18px;font-size:9px}
  .mx td{padding-right:6px}
  .checks{grid-template-columns:minmax(0,1fr)}
  .mx .task span{display:none}
}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
</style>

const total = { n: R.length, ok: R.filter((r) => r.ok).length, fa: R.filter((r) => r.fa).length, cost: R.reduce((a, r) => a + r.cost, 0),
  right: R.filter((r) => r.verdict === r.expected).length };
const failGroups = (() => {
  const g = {};
  R.filter((r) => !r.ok).forEach((r) => { const key = r.verdict === r.expected ? 'check:' + r.failed.join('+') + ':' + r.task : 'verdict:' + r.task + ':' + r.model;
    (g[key] = g[key] || []).push(r); });
  return Object.entries(g).sort((a, b) => b[1].length - a[1].length);
})();

/* ---------- provenance chip ---------- */
function prov(label, hash, status = 'Manifest match') {
  return `<button class="prov" data-prov="${esc(hash)}" title="sha256 ${esc(hash)}"><span class="ok">✓</span>${status} · ${esc(label)} <span class="mono">${short(hash)}</span></button>`;
}

/* ---------- pages ---------- */
function overview() {
  const issues = failGroups.map(([k, rs]) => {
    const r = rs[0], cls = CLASS[r.cls][0];
    if (k.startsWith('check')) {
      const models = [...new Set(rs.map((x) => x.model))];
      return `<div class="issue"><div class="t"><b>Right verdict, too much work</b><span class="n">${rs.length}</span></div>
        <p>${cls} (${r.task}). ${models.length === 3 ? 'All three models' : models.join(', ')} abstained correctly but failed <span class="mono">${r.failed.join(', ')}</span> by running more engines than the task needed.</p>
        <button class="link" data-go="runs" data-filter='${JSON.stringify({ task: r.task })}'>Show ${rs.length} runs →</button></div>`;
    }
    return `<div class="issue"><div class="t"><b>Wrong verdict</b><span class="n">${rs.length}</span></div>
      <p>${cls} (${r.task}). ${r.model} answered ${r.verdict} where the verifier expected ${r.expected}, and failed <span class="mono">${r.failed.join(', ')}</span>.</p>
      <button class="link" data-run="${r.id}">Open run →</button></div>`;
  }).join('');
  const rows = CLASS_ORDER.map((c) => {
    const cells = MODELS.map((m) => {
      const rs = R.filter((r) => r.cls === c && r.model === m).sort((a, b) => a.seed - b.seed);
      return `<td><div class="seeds">${rs.map((r) => `<button class="seed ${outcome(r)}" data-run="${r.id}" title="${m} · seed ${r.seed} · ${r.verdict}${r.failed.length ? ' · failed ' + r.failed.join(', ') : ''}" aria-label="${m} seed ${r.seed} ${r.verdict}">${r.verdict[0]}</button>`).join('')}</div></td>`;
    }).join('');
    return `<tr><td class="task"><b>${CLASS[c][0]}</b><span>should ${CLASS[c][1].toLowerCase()}</span></td>${cells}</tr>`;
  }).join('');
  const mrows = S.map((s) => `<tr>
      <td><span class="mdot" style="background:${MCOL[s.m]}"></span>${mname(s.m)}</td>
      <td class="num"><span class="hb" style="width:80px"><i style="width:${(s.ok / s.n) * 100}%;background:var(--pass)"></i></span>${pct(s.ok, s.n)}</td>
      <td class="num">${s.right} / ${s.n}</td>
      <td class="num" style="color:${s.fa ? 'var(--fail)' : 'var(--fg)'}">${s.fa}</td>
      <td class="num">${usd(s.cpv, 5)}</td>
      <td class="num">${Math.round(s.tok).toLocaleString()}</td>
      <td class="num">${s.wall.toFixed(1)}s</td></tr>`).join('');
  return `
  <section class="ph">
    <div><h1>Forge v0.2.5 baseline</h1>
      <p>${B.episodes} research episodes: ${MODELS.length} models × 6 task types × 3 seeds, frozen ${dateStr(B.created_at)}. Every run is graded by ${R[0].nChecks} deterministic checks, not by a model.</p></div>
    ${prov('v0.2.5', B.baseline_id)}
  </section>

  <section class="card kpis" aria-label="Headline numbers">
    <div class="kpi"><div class="l">Verified research success</div><div class="v">${total.ok}<small>/ ${total.n}</small></div><div class="s">${pct(total.ok, total.n)} passed every check</div></div>
    <div class="kpi"><div class="l">Correct verdict</div><div class="v">${total.right}<small>/ ${total.n}</small></div><div class="s">accept, reject or abstain matched</div></div>
    <div class="kpi"><div class="l">False alpha accepted</div><div class="v" style="color:var(--pass)">${total.fa}</div><div class="s">no fragile strategy was approved</div></div>
    <div class="kpi"><div class="l">Inference cost</div><div class="v">${usd(total.cost, 2)}</div><div class="s">all ${total.n} runs, token estimate</div></div>
  </section>

  <section class="grid g-2-1">
    <div class="card">
      <div class="ch"><h2>Outcomes by task type</h2><span class="meta">one square per seed · click to open the run</span></div>
      <div class="cb tw"><table class="mx"><thead><tr><th>Task type</th>${MODELS.map((m) => `<th><span class="mdot" style="background:${MCOL[m]}"></span>${m}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="cf"><div class="legend-row"><span><i style="background:rgba(66,201,139,.5)"></i>Verified</span><span><i style="background:rgba(232,181,74,.5)"></i>Right verdict, failed a check</span><span><i style="background:rgba(240,100,100,.55)"></i>Wrong verdict</span></div><span>Letter = submitted verdict</span></div>
    </div>
    <div class="card">
      <div class="ch"><h2>What went wrong</h2><span class="meta">${total.n - total.ok} of ${total.n} runs</span></div>
      <div class="cb issues">${issues}</div>
    </div>
  </section>

  <section class="card">
    <div class="ch"><h2>Models</h2><span class="meta">same tasks, same seeds, same checks · listed alphabetically, not ranked</span></div>
    <div class="cb tw" style="padding-top:8px"><table class="t"><thead><tr><th>Model</th><th class="num">Verified</th><th class="num">Correct verdict</th><th class="num">False alpha</th><th class="num">Cost per verified run</th><th class="num">Tokens per run</th><th class="num">Median time</th></tr></thead><tbody>${mrows}</tbody></table></div>
  </section>

  ${ladderCard()}
  <div class="foot"><span>Read-only view of frozen artifacts. Nothing here calls a live model or market.</span><span class="mono">${B.tag}</span></div>`;
}

function ladderCard() {
  const P = L.points, W = 1000, H = 260, pad = { l: 48, r: 24, t: 28, b: 54 };
  const max = Math.ceil(Math.max(...P.map((p) => p.sharpe))), min = Math.min(0, Math.floor(Math.min(...P.map((p) => p.sharpe))));
  const x = (i) => pad.l + (i / (P.length - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const names = { L0_ANALYTICAL: 'Analytical', L1_VECTORBT: 'Vectorised', L2_NAUTILUS: 'Event replay', L3_FEES_SLIPPAGE: '+ Fees & slippage', L3_LATENCY: '+ Latency', L4_COUNTERFACTUAL_STRESS: '+ Counterfactual stress' };
  const ticks = []; for (let v = min; v <= max; v++) ticks.push(v);
  const path = P.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.sharpe).toFixed(1)}`).join(' ');
  const area = path + ` L${x(P.length - 1)},${y(min)} L${x(0)},${y(min)} Z`;
  const dec = L.decomp, big = Object.entries(dec).sort((a, b) => a[1] - b[1])[0];
  const reg = L.regimes.map((r) => `<tr><td>${r.regime.replace('_', ' ').toLowerCase().replace(/^./, (c) => c.toUpperCase())}</td><td class="num">${r.sharpe.L0_ANALYTICAL.toFixed(2)}</td><td class="num">${r.sharpe.L4_COUNTERFACTUAL_STRESS.toFixed(2)}</td><td class="num" style="color:${r.survival > 0 ? 'var(--fg)' : 'var(--fail)'}">${(r.survival * 100).toFixed(1)}%</td></tr>`).join('');
  return `<section class="grid g-2-1">
    <div class="card ladder">
      <div class="ch"><h2>Reality ladder · how much edge survives</h2><span class="meta">${L.metric} at each level of realism · ${short(L.hash)}</span></div>
      <div class="cb" style="padding-top:8px">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sharpe ratio falling from ${P[0].sharpe.toFixed(2)} to ${P[P.length - 1].sharpe.toFixed(2)} across the reality ladder">
          <defs>
            <linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F0A929" stop-opacity=".22"/><stop offset="1" stop-color="#F0A929" stop-opacity="0"/></linearGradient>
            <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          ${ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#3A4048' : '#1A1E23'}" stroke-width="1"/><text x="${pad.l - 12}" y="${y(v) + 4}" text-anchor="end" fill="#6C757D" font-family="JetBrains Mono, monospace" font-size="12">${v}</text>`).join('')}
          <path d="${area}" fill="url(#lg)"/>
          <path d="${path}" fill="none" stroke="#F0A929" stroke-width="2.5" filter="url(#glow)" stroke-linejoin="round"/>
          ${P.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.sharpe)}" r="${i === P.length - 1 ? 6 : 4.5}" fill="${i === P.length - 1 ? '#F06464' : '#0B0D10'}" stroke="${i === P.length - 1 ? '#F06464' : '#F0A929'}" stroke-width="2"/>
            <text x="${x(i)}" y="${y(p.sharpe) - 14}" text-anchor="middle" fill="${i === P.length - 1 ? '#F06464' : '#E7EAEC'}" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500">${p.sharpe.toFixed(2)}</text>
            <text x="${x(i)}" y="${H - pad.b + 24}" text-anchor="${i === 0 ? 'start' : i === P.length - 1 ? 'end' : 'middle'}" fill="#A3ABB2" font-family="Inter, sans-serif" font-size="12.5">${names[p.cp] || p.cp}</text>
            <text x="${x(i)}" y="${H - pad.b + 42}" text-anchor="${i === 0 ? 'start' : i === P.length - 1 ? 'end' : 'middle'}" fill="#6C757D" font-family="JetBrains Mono, monospace" font-size="11">${p.engine}</text>`).join('')}
        </svg>
      </div>
      <div class="ladder-meta">
        <div><div class="l">Edge that survives</div><div class="v" style="color:var(--fail)">${(L.survival * 100).toFixed(1)}%</div></div>
        <div><div class="l">Biggest loss</div><div class="v">${big[1].toFixed(2)} <span class="sub">Sharpe, stress</span></div></div>
        <div><div class="l">Latency cost</div><div class="v">${dec.latency_decay.toFixed(2)} <span class="sub">Sharpe</span></div></div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><h2>By market regime</h2><span class="meta">${L.regimes[0].seeds} seeds each</span></div>
      <div class="cb tw" style="padding-top:8px"><table class="t" style="min-width:0"><thead><tr><th>Regime</th><th class="num">Start</th><th class="num">Stressed</th><th class="num">Survives</th></tr></thead><tbody>${reg}</tbody></table></div>
      <div class="cf"><span>${esc(L.finding)}</span></div>
    </div>
  </section>`;
}

const RS = { model: 'all', out: 'all', cls: 'all', q: '', task: null, sel: null };
function runs() {
  const list = R.filter((r) => (RS.model === 'all' || r.model === RS.model) && (RS.out === 'all' || outcome(r) === RS.out)
    && (RS.cls === 'all' || r.cls === RS.cls) && (!RS.task || r.task === RS.task)
    && (!RS.q || (r.task + ' ' + r.cls + ' ' + r.model + ' ' + r.reason).toLowerCase().includes(RS.q.toLowerCase())))
    .sort((a, b) => a.task.localeCompare(b.task) || a.model.localeCompare(b.model) || a.seed - b.seed);
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button aria-pressed="${RS[key] === v}" data-f="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const body = list.map((r) => `<tr class="click" data-run="${r.id}" aria-selected="${RS.sel === r.id}" tabindex="0">
      <td><b style="font-weight:500">${CLASS[r.cls][0]}</b><div class="sub mono">${r.task}</div></td>
      <td><span class="mdot" style="background:${MCOL[r.model]}"></span>${r.model}</td>
      <td class="num">${r.seed}</td>
      <td>${vpill(r.verdict)} ${r.verdict === r.expected ? '' : `<span class="sub">expected ${r.expected.toLowerCase()}</span>`}</td>
      <td>${r.ok ? '<span class="b pass">Verified</span>' : r.verdict === r.expected ? `<span class="b warn">${r.failed.length} check failed</span>` : '<span class="b fail">Wrong verdict</span>'}</td>
      <td class="num">${r.turns.length}</td>
      <td class="num">${r.tok.toLocaleString()}</td>
      <td class="num">${usd(r.cost, 5)}</td>
      <td class="num">${r.wall.toFixed(1)}s</td></tr>`).join('');
  return `
  <section class="ph"><div><h1>Runs</h1><p>Every trajectory in the v0.2.5 baseline. Open a run to see each step the agent took and which checks it passed.</p></div>${prov('runs', F.runsArtifactHash)}</section>
  <section class="card">
    <div class="filters">
      ${seg('model', [['all', 'All models'], ...MODELS.map((m) => [m, m])])}
      ${seg('out', [['all', 'All outcomes'], ['ok', 'Verified'], ['part', 'Failed a check'], ['bad', 'Wrong verdict']])}
      <select class="inp" id="f-cls" aria-label="Task type"><option value="all">All task types</option>${CLASS_ORDER.map((c) => `<option value="${c}" ${RS.cls === c ? 'selected' : ''}>${CLASS[c][0]}</option>`).join('')}</select>
      <input class="inp" id="f-q" placeholder="Search reason, task or model" value="${esc(RS.q)}" aria-label="Search runs">
      ${RS.task ? `<button class="kbd" data-clear-task>Task ${RS.task} ✕</button>` : ''}
      <span class="count">${list.length} of ${R.length}</span>
    </div>
    <div class="tw"><table class="t"><thead><tr><th>Task</th><th>Model</th><th class="num">Seed</th><th>Verdict</th><th>Grade</th><th class="num">Steps</th><th class="num">Tokens</th><th class="num">Cost</th><th class="num">Time</th></tr></thead>
      <tbody>${body || `<tr><td colspan="9" class="empty-inline" style="padding:28px 14px">No runs match these filters.</td></tr>`}</tbody></table></div>
  </section>`;
}

function bench() {
  const rows = S.map((s) => `<tr><td><span class="mdot" style="background:${MCOL[s.m]}"></span>${mname(s.m)}</td><td class="num">${s.n}</td><td class="num">${s.ok}</td><td class="num">${s.right}</td><td class="num">${s.fa}</td><td class="num">${usd(s.cost, 4)}</td><td class="num">${s.wall.toFixed(1)}s</td></tr>`).join('');
  return `
  <section class="ph"><div><h1>Bench</h1><p>Released baselines. A baseline is a frozen set of runs with a manifest; numbers here are observations of that release, not a global ranking.</p></div></section>
  <section class="card">
    <div class="tw"><table class="t"><thead><tr><th>Baseline</th><th>Status</th><th class="num">Episodes</th><th class="num">Attempts</th><th class="num">Excluded</th><th>Models</th><th>Created</th><th>Integrity</th></tr></thead>
    <tbody>
      <tr><td><b style="font-weight:500">v0.2.5</b><div class="sub">real API, single agent</div></td><td><span class="b pass">Released</span></td><td class="num">${B.episodes}</td><td class="num">${B.attempts_total}</td><td class="num">${B.excluded_attempts}</td><td>${B.models.map((m) => m.split('-').pop()).join(', ')}</td><td>${dateStr(B.created_at)}</td><td><span class="b pass">Manifest match</span></td></tr>
      <tr><td><b style="font-weight:500">v0.2.5.1</b><div class="sub">hardened</div></td><td><span class="b neutral">Not released</span></td><td class="num faint">—</td><td class="num faint">—</td><td class="num faint">—</td><td class="faint">—</td><td class="faint">—</td><td class="faint">No artifact yet</td></tr>
      <tr><td><b style="font-weight:500">v0.3</b><div class="sub">multi-agent</div></td><td><span class="b neutral">Not released</span></td><td class="num faint">—</td><td class="num faint">—</td><td class="num faint">—</td><td class="faint">—</td><td class="faint">—</td><td class="faint">No artifact yet</td></tr>
    </tbody></table></div>
  </section>
  <section class="grid g-2-1">
    <div class="card"><div class="ch"><h2>v0.2.5 observations by model</h2><span class="meta">alphabetical</span></div>
      <div class="cb tw" style="padding-top:8px"><table class="t"><thead><tr><th>Model</th><th class="num">Runs</th><th class="num">Verified</th><th class="num">Correct verdict</th><th class="num">False alpha</th><th class="num">Total cost</th><th class="num">Median time</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="ch"><h2>Integrity</h2></div>
      <div class="cb"><dl class="ids">
        <dt>Baseline id</dt><dd>${B.baseline_id}</dd><button class="copy" data-copy="${B.baseline_id}">Copy</button>
        <dt>Schema</dt><dd>${B.source_schema_version}</dd><span></span>
        <dt>Manifest</dt><dd>${B.integrity.manifest}</dd><span></span>
        <dt>Checked</dt><dd>${B.integrity.checked_files.join(', ')}</dd><span></span>
      </dl>
      <p class="sub" style="margin:14px 0 0">${B.excluded_attempts} of ${B.attempts_total} attempts was excluded before freezing; the manifest records why.</p></div></div>
  </section>`;
}

function evidence() {
  const kind = { REAL_API_BASELINE: 'Real API baseline', REALITY_LADDER: 'Reality ladder', ENGINE_CERTIFICATION: 'Engine certification' };
  const st = { MANIFEST_MATCH: ['pass', 'Manifest match'], FROZEN_ARTIFACT: ['info', 'Frozen'], BOUND_REFERENCE: ['neutral', 'Bound reference'] };
  const arows = F.artifacts.map((a) => `<tr><td><b style="font-weight:500">${kind[a.kind] || a.kind}</b><div class="sub mono">${a.artifact_id}</div></td><td><span class="b ${st[a.integrity_status][0]}">${st[a.integrity_status][1]}</span></td><td class="num">${a.source_file_count}</td><td class="mono sub">${a.source_schema_version}</td><td class="mono">${short(a.artifact_hash, 12)}</td><td><button class="copy" data-copy="${a.artifact_hash}">Copy</button></td></tr>`).join('');
  const wrows = F.worlds.map((w) => `<tr><td class="mono">${short(w.hash, 12)}</td><td>${w.tasks.map((t) => `<button class="link" data-go="runs" data-filter='${JSON.stringify({ task: t })}'>${t}</button>`).join(', ')}</td><td class="num">${w.refs}</td><td>${w.manifest ? '<span class="b pass">Exported</span>' : '<span class="b neutral">Not exported</span>'}</td><td><button class="copy" data-copy="${w.hash}">Copy</button></td></tr>`).join('');
  return `
  <section class="ph"><div><h1>Evidence</h1><p>Content-addressed artifacts behind every number in Forge, and the market worlds the agents were tested in.</p></div></section>
  <section class="card"><div class="ch"><h2>Artifacts</h2><span class="meta">${F.artifacts.length} bound to this release</span></div>
    <div class="cb tw" style="padding-top:8px"><table class="t"><thead><tr><th>Artifact</th><th>Integrity</th><th class="num">Files</th><th>Schema</th><th>Hash</th><th></th></tr></thead><tbody>${arows}</tbody></table></div></section>
  <section class="card"><div class="ch"><h2>Worlds</h2><span class="meta">${F.worlds.length} frozen market worlds · ${F.worlds.reduce((a, w) => a + w.refs, 0)} run references</span></div>
    <div class="cb tw" style="padding-top:8px"><table class="t"><thead><tr><th>World</th><th>Task</th><th class="num">Runs</th><th>Manifest</th><th></th></tr></thead><tbody>${wrows}</tbody></table></div>
    <div class="cf"><span>World manifests (policies, parents, interventions) are not part of the v0.2.5 export. Runs reference each world by hash, so the binding is still verifiable.</span></div></section>`;
}

/* ---------- drawer ---------- */
function openRun(id) {
  const r = R.find((x) => x.id === id); if (!r) return;
  RS.sel = id;
  const maxc = Math.max(...r.turns.map((t) => t.c), 1e-9);
  const checks = [...r.failed.map((k) => [k, false]), ...['artifact_binding','budget','completed','decision_binding','efficient_routing','model_action_binding','model_identity','model_metering','prompt_identity','required_evidence','sealed_data_hidden','task_identity','tool_schema_identity','trajectory_actions','usage_counters','verdict'].filter((k) => !r.failed.includes(k)).map((k) => [k, true])].slice(0, r.nChecks);
  $('#drawer').innerHTML = `
    <div class="dh"><div><h3>${CLASS[r.cls][0]} · <span style="color:${MCOL[r.model]}">${r.model}</span></h3><div class="sub mono">${r.task} · seed ${r.seed}</div></div><button class="x" id="close-d" aria-label="Close">×</button></div>
    <div class="db">
      <div class="sect"><h4>Verdict</h4><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${vpill(r.verdict)}<span class="sub">${r.verdict === r.expected ? 'matches expected' : 'expected ' + r.expected.toLowerCase()}</span>${r.ok ? '<span class="b pass">Verified</span>' : r.verdict === r.expected ? '<span class="b warn">Right verdict, failed a check</span>' : '<span class="b fail">Wrong verdict</span>'}</div>
        <p class="quote" style="margin-top:12px">${esc(r.reason)}</p></div>
      <div class="sect"><h4>Trajectory · ${r.turns.length} steps · ${r.tok.toLocaleString()} tokens · ${usd(r.cost, 5)} · ${r.wall.toFixed(1)}s</h4>
        <ol class="steps">${r.turns.map((t, i) => `<li><span class="k">${i + 1}</span><span class="act">${ACTION[t.a] || t.a}<small>${t.a}</small></span><span class="num">${(t.ti + t.to).toLocaleString()} tok · ${t.l.toFixed(1)}s<br><span class="hb" style="width:60px;margin:6px 0 0"><i style="width:${(t.c / maxc) * 100}%;background:var(--amber)"></i></span>${usd(t.c, 5)}</span></li>`).join('')}</ol></div>
      <div class="sect"><h4>Checks · ${r.nChecks - r.failed.length} of ${r.nChecks} passed</h4>
        <div class="checks">${checks.map(([k, v]) => `<div class="${v ? 'y' : 'n'}"><i>${v ? '✓' : '✕'}</i>${CHECK(k)}</div>`).join('')}</div></div>
      <div class="sect"><h4>Identifiers</h4><dl class="ids">
        <dt>Run</dt><dd>${r.id}</dd><button class="copy" data-copy="${r.id}">Copy</button>
        <dt>World</dt><dd>${r.world}</dd><button class="copy" data-copy="${r.world}">Copy</button>
        <dt>Model</dt><dd>${mname(r.model)}</dd><span></span></dl></div>
    </div>`;
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open');
  document.querySelectorAll('[data-run]').forEach((el) => el.tagName === 'TR' && el.setAttribute('aria-selected', String(el.dataset.run === id)));
  $('#close-d').focus();
}
function closeRun() { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); RS.sel = null;
  document.querySelectorAll('tr[data-run]').forEach((el) => el.setAttribute('aria-selected', 'false')); }

/* ---------- router ---------- */
const PAGES = { overview, runs, bench, evidence };
let route = 'overview';
function render() {
  const h = (location.hash || '#overview').slice(1);
  route = PAGES[h] ? h : 'overview';
  $('#page').innerHTML = PAGES[route]();
  document.querySelectorAll('nav.main a[data-r]').forEach((a) => a.setAttribute('aria-current', a.dataset.r === route ? 'page' : 'false'));
  document.title = route === 'overview' ? 'FinSight Forge' : `FinSight Forge · ${route[0].toUpperCase() + route.slice(1)}`;
}
addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-run],[data-go],[data-f],[data-copy],[data-clear-task],#close-d,#scrim,[data-prov]');
  if (!t) return;
  if (t.id === 'close-d' || t.id === 'scrim') return closeRun();
  if (t.dataset.copy) { const v = t.dataset.copy; navigator.clipboard?.writeText(v).then(() => { t.textContent = 'Copied'; setTimeout(() => (t.textContent = 'Copy'), 1200); }).catch(() => {}); return; }
  if (t.dataset.prov) { location.hash = '#evidence'; return; }
  if ('clearTask' in t.dataset) { RS.task = null; return render(); }
  if (t.dataset.f) { RS[t.dataset.f] = t.dataset.v; return render(); }
  if (t.dataset.go) { Object.assign(RS, { model: 'all', out: 'all', cls: 'all', q: '', task: null }, JSON.parse(t.dataset.filter || '{}')); if (location.hash === '#' + t.dataset.go) render(); else location.hash = '#' + t.dataset.go; return; }
  if (t.dataset.run) openRun(t.dataset.run);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#pal').classList.contains('open')) closePal(); else closeRun(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-run]')) openRun(e.target.dataset.run);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'f-q') { RS.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#f-q'); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'f-cls') { RS.cls = e.target.value; render(); } });

/* ---------- palette ---------- */
let palItems = [], palIdx = 0;
function palData(q) {
  const base = [['Overview', 'page', () => (location.hash = '#overview')], ['Runs', 'page', () => (location.hash = '#runs')], ['Bench', 'page', () => (location.hash = '#bench')], ['Evidence', 'page', () => (location.hash = '#evidence')],
    ['Observatory', 'page', () => (location.href = 'observatory.html')],
    ...MODELS.map((m) => [`Runs by ${m}`, 'filter', () => { Object.assign(RS, { model: m, out: 'all', cls: 'all', q: '', task: null }); location.hash === '#runs' ? render() : (location.hash = '#runs'); }]),
    ['Failed runs', 'filter', () => { Object.assign(RS, { model: 'all', out: 'part', cls: 'all', q: '', task: null }); location.hash === '#runs' ? render() : (location.hash = '#runs'); }],
    ...[...new Set(R.map((r) => r.task))].map((t) => [`${t} · ${CLASS[R.find((r) => r.task === t).cls][0]}`, 'task', () => { Object.assign(RS, { model: 'all', out: 'all', cls: 'all', q: '', task: t }); location.hash === '#runs' ? render() : (location.hash = '#runs'); }])];
  return base.filter(([l]) => l.toLowerCase().includes(q.toLowerCase()));
}
function drawPal() {
  palItems = palData($('#pal-in').value); palIdx = Math.min(palIdx, Math.max(0, palItems.length - 1));
  $('#pal-list').innerHTML = palItems.map(([l, k], i) => `<button data-i="${i}" aria-selected="${i === palIdx}">${esc(l)}<span>${k}</span></button>`).join('') || '<div class="sub" style="padding:10px">No matches</div>';
}
function openPal() { $('#pal').classList.add('open'); $('#pal-in').value = ''; palIdx = 0; drawPal(); $('#pal-in').focus(); }
function closePal() { $('#pal').classList.remove('open'); }
$('#open-pal').addEventListener('click', openPal);
$('#pal').addEventListener('click', (e) => { if (e.target.id === 'pal') return closePal(); const b = e.target.closest('[data-i]'); if (b) { closePal(); palItems[+b.dataset.i][2](); } });
$('#pal-in').addEventListener('input', () => { palIdx = 0; drawPal(); });
$('#pal-in').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palIdx + 1, palItems.length - 1); drawPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(palIdx - 1, 0); drawPal(); e.preventDefault(); }
  if (e.key === 'Enter' && palItems[palIdx]) { closePal(); palItems[palIdx][2](); }
});

render();
})();
</script>
