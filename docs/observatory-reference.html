<title>FinSight Model Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the scene is the page. Full-bleed WebGL stage, thin chrome bars above and below, one translucent readout docked right. */
:root{
  color-scheme:dark;
  --bg:#000000;
  --chrome:#06080A;
  --panel:rgba(8,10,12,.80);
  --panel-solid:#0A0C0E;
  --line:rgba(231,234,236,.08);
  --line-2:rgba(231,234,236,.16);
  --fg:#E7EAEC;
  --muted:#9AA2A9;
  --faint:#5F676F;
  --amber:#F0A929;
  --up:#42C98B;
  --down:#F06464;
  --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}
.bar{grid-row:1}.stage{grid-row:2;grid-column:1}.timeline{grid-row:3}

/* top bar */
.bar{display:flex;align-items:center;gap:20px;padding:0 20px;height:52px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mark{width:22px;height:22px;border:1px solid var(--amber);color:var(--amber);display:grid;place-items:center;font:500 11px var(--font-mono)}
.brand b{font-weight:600;font-size:13px}
.brand span{color:var(--faint);font-size:13px}
.tabs{display:flex;gap:2px;height:100%}
.tabs button{background:none;border:0;padding:0 14px;height:100%;color:var(--muted);font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-bottom:1px solid transparent}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--amber)}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
.chip{font:11px var(--font-mono);color:var(--muted);border:1px solid var(--line-2);padding:3px 8px;border-radius:2px;white-space:nowrap;letter-spacing:.04em}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
.chip.ticker{color:var(--fg)}
.ghost{background:none;border:1px solid var(--line-2);color:var(--muted);font:11px var(--font-mono);padding:3px 10px;border-radius:2px;cursor:pointer;letter-spacing:.04em}
.ghost:hover{color:var(--fg);border-color:var(--faint)}

/* stage */
.stage{position:relative;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px/1.35 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-shadow:0 0 6px #000,0 0 12px #000;will-change:transform}
.lb small{display:block;font-weight:400;font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--faint)}
.lb.state{font-size:11.5px}
.lb.axis{color:var(--faint);font-size:10px}
.lb.rho{color:var(--faint);font-size:10.5px;text-transform:none;letter-spacing:.02em}
.lb.feat{text-transform:none;letter-spacing:.02em;font-size:10.5px}
.lb .auc{display:inline-block;margin-top:4px;padding:1px 6px;border:1px solid currentColor;border-radius:2px}
.lb.dim{opacity:.35}
.lb.today{color:var(--fg)}
.hud{position:absolute;z-index:2}
.title{top:22px;left:24px;max-width:430px;pointer-events:none}
.title h1{margin:0 0 6px;font:600 20px/1.25 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.title p{margin:0;color:var(--muted);font-size:13px;max-width:48ch}
.legend{left:24px;bottom:18px;display:flex;flex-wrap:wrap;gap:6px 16px;font:10.5px var(--font-mono);color:var(--muted);letter-spacing:.04em;max-width:calc(100% - 760px);pointer-events:none}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0;box-shadow:0 0 8px currentColor}
.hint{right:376px;bottom:18px;font:10px var(--font-mono);color:var(--faint);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
#fps{top:12px;right:360px;font:10px var(--font-mono);color:var(--faint)}

/* readout */
.readout{grid-row:2;grid-column:1;justify-self:end;align-self:stretch;margin:16px;min-height:0;z-index:3;width:320px;overflow:auto;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:4px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.eyebrow{font:500 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.k{font:500 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.big{font:600 22px/1.2 var(--font-ui);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.num{font:500 26px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.rows{display:grid;gap:0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.rows div:last-child{border-bottom:0}
.rows span{color:var(--muted)}
.rows b{font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.spark{width:100%;height:46px;display:block;margin-top:8px}
.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:2px;font:11px var(--font-mono);font-variant-numeric:tabular-nums}
.matrix span{padding:5px 0;text-align:center;border-radius:2px}
.matrix .h{color:var(--faint);font-size:10px}
.matrix .r{text-align:left;padding-right:6px}
.dotc{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.stack{display:flex;height:6px;border-radius:1px;overflow:hidden;background:var(--line);margin-bottom:8px}
.occ{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.occ b{font:500 12px var(--font-mono)}
.occ span.z{color:var(--faint)}
.fine{margin:0;color:var(--faint);font-size:11.5px;line-height:1.5}
.verdict{display:flex;align-items:center;gap:8px;font:600 18px/1.2 var(--font-ui)}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 10px var(--down)}
.lead{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.bullet{position:relative;height:30px;margin-top:6px}
.bullet .track{position:absolute;left:0;right:0;top:12px;height:6px;background:linear-gradient(90deg,rgba(240,100,100,.22),rgba(240,100,100,.08) 49.5%,rgba(66,201,139,.08) 50.5%,rgba(66,201,139,.22))}
.bullet .chance{position:absolute;top:6px;bottom:6px;left:50%;width:1px;background:var(--muted)}
.bullet .mk{position:absolute;top:8px;width:3px;height:14px;margin-left:-1px;background:var(--fg);border-radius:1px}
.bullet .ax{position:absolute;top:22px;font:10px var(--font-mono);color:var(--faint);transform:translateX(-50%)}
.fam{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.fam .fb{position:relative;height:6px;background:var(--line);overflow:visible}
.fam .fb i{position:absolute;top:0;bottom:0}
.fam .fb::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.fam b{font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.fam .tag{font:10px var(--font-mono);color:var(--faint);margin-left:6px}
.folds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:74px;margin-top:4px}
.folds div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font:10px var(--font-mono);color:var(--faint)}
.folds i{display:block;width:100%;border-radius:1px}
.folds b{font:500 11px var(--font-mono);color:var(--fg)}
.top{display:grid;gap:7px}
.top div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:11.5px var(--font-mono)}
.top em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top b{font-weight:500;color:var(--muted)}

/* timeline */
.timeline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 20px 12px;background:var(--chrome);border-top:1px solid var(--line)}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--amber);background:none;color:var(--amber);cursor:pointer;display:grid;place-items:center}
.play:hover{background:rgba(240,169,41,.1)}
.play svg{width:12px;height:12px;fill:currentColor}
.track-wrap{display:grid;gap:6px;min-width:0}
#ribbon{width:100%;height:20px;display:block}
.ribbon-ax{display:flex;justify-content:space-between;font:10px var(--font-mono);color:var(--faint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--amber) var(--p,100%),var(--line-2) var(--p,100%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--amber)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--amber);margin-top:-5px;box-shadow:0 0 10px rgba(240,169,41,.6)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--amber)}
.tl-label{font:11px var(--font-mono);color:var(--muted);white-space:nowrap;text-align:right;min-width:230px;letter-spacing:.04em}
.tl-label b{color:var(--fg);font-weight:500}

/* tooltip + drawer */
#tip{position:absolute;z-index:5;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:3px;padding:9px 11px;font:11px/1.6 var(--font-mono);color:var(--muted);max-width:280px;opacity:0;transition:opacity .12s}
#tip strong{display:block;color:var(--fg);font-weight:500;font-size:11.5px;margin-bottom:2px}
#method{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel-solid);border-left:1px solid var(--line-2);z-index:10;transform:translateX(100%);transition:transform .25s cubic-bezier(.16,1,.3,1);padding:22px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
#method.open{transform:none}
#method h2{margin:0;font:600 16px var(--font-ui)}
#method p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
#method dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}
#method dt{color:var(--faint);font:10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
#method dd{margin:0;font:11.5px var(--font-mono);word-break:break-all}
#method .close{align-self:flex-end}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:24px;text-align:center}

@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;grid-template-rows:auto auto auto auto}
  .bar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .tabs{height:36px}
  .chips{margin-left:0;flex-wrap:wrap}
  .stage{height:66vh;min-height:420px}
  .title{left:16px;top:14px;right:16px}
  .title h1{font-size:17px}
  .title p{font-size:12px}
  .legend{left:16px;bottom:12px;max-width:calc(100% - 32px)}
  .hint,#fps{display:none}
  .lb small{display:none}
  .readout{grid-row:4;justify-self:stretch;width:auto;margin:16px;overflow:visible}
  .ribbon-ax span:nth-child(2){display:none}
  .title p{display:none}
  .timeline{grid-template-columns:auto minmax(0,1fr);padding:10px 16px}
  .tl-label{grid-column:1 / -1;text-align:left;min-width:0}
}
@media (max-width:1180px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){#method{transition:none}}
</style>

    const cls = 'lb ' + (L.cls || ''); if (d.className !== cls) d.className = cls;

    return `<div>${a == null ? '' : `<b style="color:${aucColor(a)}">${a.toFixed(2)}</b>`}<i style="height:${a == null ? 2 : Math.max(3, (a - 0.4) / 0.2 * 44)}px;background:${a == null ? 'var(--line)' : aucColor(a)};opacity:.75"></i>F${x.fold}</div>`; }).join('');
  $('#readout').innerHTML = `
    <div class="eyebrow">Gradient boosting · ${NFt} features · ${NL} folds</div>
    <div><div class="verdict">No predictive edge</div>
      <p class="lead">Every model family scored below a coin flip on validation, and the untouched holdout came in at ${ho.auc.toFixed(3)}.</p></div>
    <div><div class="k">Untouched holdout · ${ho.model} · ${ho.rows} days</div>
      <div class="bullet"><div class="track"></div><div class="chance"></div><div class="mk" style="left:${bulletPos(ho.auc)}%"></div>
        <span class="ax" style="left:0%;transform:none">0.40</span><span class="ax" style="left:50%">0.50 chance</span><span class="ax" style="left:100%;transform:translateX(-100%)">0.60</span></div>
      <div class="sub mono">AUC ${ho.auc.toFixed(3)} · ${range(ho.start.slice(0, 10), ho.end.slice(0, 10))}</div></div>
    <div><div class="k">Validation AUC by model family</div>
      <div class="fam">${sel.map((m) => `<span>${m.model.replace('_', ' ')}${m.model === S.selected ? '<span class="tag">picked</span>' : ''}${m.traced ? '<span class="tag">shown</span>' : ''}</span>
        <span class="fb"><i style="left:${Math.min(50, bulletPos(m.auc))}%;width:${Math.abs(bulletPos(m.auc) - 50)}%;background:${aucColor(m.auc)}"></i></span><b style="color:${aucColor(m.auc)}">${m.auc.toFixed(3)}</b>`).join('')}</div></div>
    <div><div class="k">Gradient boosting, per fold</div><div class="folds">${folds}</div></div>
    <p class="fine">Feature rankings barely move between folds (ρ ${Math.min(...S.rho).toFixed(2)} to ${Math.max(...S.rho).toFixed(2)}). The model keeps leaning on the same inputs, and they still don't predict next-day direction.</p>
    <div><div class="k">Most used · fold ${fo.fold}, stage ${fo.stages[s]}</div>
      <div class="top">${top.map((i) => `<div><i class="dotc" style="background:${FC[S.family[i]]}"></i><em>${S.features[i]}</em><b>${imp[i].toFixed(3)}</b></div>`).join('')}</div></div>`;
}
function drawRibbon() {
  const dpr = Math.min(devicePixelRatio, 2), w = ribbon.clientWidth, h = ribbon.clientHeight;
  if (ribbon.width !== Math.round(w * dpr)) { ribbon.width = Math.round(w * dpr); ribbon.height = Math.round(h * dpr); }
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0); rctx.clearRect(0, 0, w, h);
  if (active === 'hmm') {
    const f = hmm.F.f, n = f.st.length, bw = w / n;
    for (let i = 0; i < n; i++) { const hh = 4 + (h - 4) * f.pm[i]; rctx.fillStyle = HC[f.st[i]]; rctx.globalAlpha = 0.35 + 0.55 * f.pm[i]; rctx.fillRect(i * bw, h - hh, Math.max(1, bw - 0.4), hh); }
    rctx.globalAlpha = 1;
  } else {
    const n = frames.length, bw = w / n;
    frames.forEach(([fk, s], i) => { const a = S.folds[fk].auc[s], hh = 3 + Math.min(1, Math.abs(a - 0.5) / 0.08) * (h - 4);
      rctx.fillStyle = a < 0.5 ? '#F06464' : '#42C98B'; rctx.globalAlpha = i <= sg.idx ? 0.8 : 0.18;
      rctx.fillRect(i * bw, a < 0.5 ? h / 2 : h / 2 - hh / 2, Math.max(1, bw - 0.5), hh / 2); });
    rctx.globalAlpha = 0.5; rctx.fillStyle = '#9AA2A9'; rctx.fillRect(0, h / 2, w, 0.5); rctx.globalAlpha = 1;
  }
}
function timelineText() {
  if (active === 'hmm') {
    const f = hmm.F.f; $('#tl').innerHTML = `EM <b>${f.it}</b> / ${H.frames[NF - 1].it} · LL <b>${fmt(f.ll, 1)}</b>`;
    $('#rax').innerHTML = `<span>${H.dates[0]}</span><span>Regime by day · last 250 sessions</span><span>${H.dates[H.dates.length - 1]}</span>`;
  } else {
    const [f, s] = frames[sg.idx], fo = S.folds[f];
    $('#tl').innerHTML = `Fold <b>${fo.fold}</b> / ${NL} · stage <b>${fo.stages[s]}</b> · val AUC <b style="color:${aucColor(fo.auc[s])}">${fo.auc[s].toFixed(3)}</b>`;
    $('#rax').innerHTML = `<span>Fold 1</span><span>Validation AUC above / below 0.50, every boosting stage</span><span>Fold ${NL}</span>`;
  }
  scrub.style.setProperty('--p', (scrub.value / scrub.max) * 100 + '%');
}
const TXT = {
  hmm: ['Where the market sits, by the model\'s own map', 'Each glow is one regime the Gaussian HMM learned from SPY, placed by its average 20-day return, volatility and drawdown. Bundles show how often one regime hands over to another.'],
  sig: ['What the signal model leans on, fold by fold', 'Columns are walk-forward folds. Every line is one feature, re-sorted by how much the trees used it in that fold. Brighter lines carry more weight.'],
};
function legend() {
  $('#legend').innerHTML = active === 'hmm'
    ? H.labels.map((l, s) => `<span><i style="background:${HC[s]};color:${HC[s]}"></i>${l}</span>`).join('')
    : S.families.map((l, k) => `<span><i style="background:${FC[k]};color:${FC[k]}"></i>${l}</span>`).join('');
}
function method() {
  const D = active === 'hmm' ? H : S, p = D.prov || {};
  $('#m-h').textContent = active === 'hmm' ? 'Regime space · method' : 'Feature flow · method';
  const rows = active === 'hmm'
    ? [['What it shows', H.semantics], ['Axes', 'State means on rolling_return_20, realized_vol_20 and drawdown_from_252_high, scaled to standard deviations by the fit\'s own scaler.'], ['Clouds', 'Samples from each state\'s diagonal Gaussian on those three features. Density follows the stationary share of time in each state.']]
    : [['Importance', S.impSem], ['Split', S.split], ['Horizon / embargo', `${S.horizon} day / ${S.embargo} rows`], ['Model shown', 'Gradient boosting is the only family with a stage-by-stage trace. The holdout model is ' + S.selected + '.']];
  $('#m-body').innerHTML = `${rows.map(([k, v]) => `<div><div class="k">${k}</div><p>${v}</p></div>`).join('')}
    <div><div class="k">Claims</div><dl>${Object.entries(D.claims).map(([k, v]) => `<dt>${k.replaceAll('_', ' ')}</dt><dd>${v ? 'yes' : 'no'}</dd>`).join('')}</dl></div>
    <div><div class="k">Provenance</div><dl><dt>trace sha256</dt><dd>${D.sha}</dd><dt>as of</dt><dd>${D.asOf}</dd>
    ${p.coverage ? `<dt>coverage</dt><dd>${p.coverage}</dd><dt>evidence</dt><dd>${p.evidence_mode}</dd><dt>observations</dt><dd>${p.observations}</dd><dt>price basis</dt><dd>${p.price_basis}</dd>` : ''}</dl>
    ${p.disclosure ? `<p style="margin-top:10px">${p.disclosure}</p>` : ''}</div>`;
}

/* ---------- camera framing ---------- */
const PRESET = { hmm: new THREE.Vector3(0.85, 0.42, 1.25).normalize(), sig: new THREE.Vector3(0.22, 0.08, 1).normalize() };
let panelW = 0;
function frame(snap) {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  panelW = w > 900 ? 352 : 0;
  const availW = w - panelW, aspect = availW / h;
  const r = active === 'hmm' ? hmm.radius : 10.2;
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * aspect);
  const dist = (r / Math.sin(Math.min(vf, hf))) * (active === 'hmm' ? 0.92 : 0.93);
  controls.minDistance = dist * 0.45; controls.maxDistance = dist * 2;
  if (snap) { camera.position.copy(PRESET[active]).multiplyScalar(dist); if (active === 'sig') controls.target.set(-0.3, 0.55, 0); else controls.target.set(0, 0, 0); }
}
function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h;
  panelW = w > 900 ? 352 : 0;
  if (panelW) camera.setViewOffset(w + panelW, h, panelW, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  const ps = renderer.getPixelRatio() * (h / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  for (const m of [cloudMat, coreMat, sgPointMat]) m.uniforms.uScale.value = ps;
  drawRibbon();
}
new ResizeObserver(() => { resize(); frame(false); }).observe(stageEl);

/* ---------- switching + timeline ---------- */
let playing = false, playT = 0;
function show(name) {
  active = name; renderPass.scene = scenes[name];
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.scene === name)));
  const D = name === 'hmm' ? H : S;
  $('#c-ticker').textContent = D.ticker;
  $('#c-src').innerHTML = `<span class="dot"></span>Replay · ${D.sha.slice(0, 8)}…${D.sha.slice(-4)}`; $('#c-src').title = 'sha256 ' + D.sha;
  $('#c-asof').textContent = 'As of ' + D.asOf.slice(0, 10);
  $('#t-h').textContent = TXT[name][0]; $('#t-p').textContent = TXT[name][1];
  bloom.strength = name === 'hmm' ? 0.85 : 0.55;
  controls.autoRotate = !reduced && name === 'hmm';
  if (name === 'hmm') { scrub.max = NF - 1; scrub.value = Math.round(hmm.target); hmmLabels(); readHMM(); }
  else { scrub.max = frames.length - 1; scrub.value = sg.idx; sigLabels(); readSig(); }
  playing = false; legend(); method(); frame(true); resize(); timelineText(); drawRibbon();
  try { history.replaceState(null, '', '#' + (name === 'hmm' ? 'regimes' : 'features')); } catch (e) {}
}
function setHMM(t) { hmm.target = t; }
function setSig(i) { if (i === sg.idx) return; sg.idx = i; setSigTargets(i); sg.dirty = true; sigLabels(); readSig(); timelineText(); drawRibbon(); }
scrub.addEventListener('input', () => { playing = false; const v = +scrub.value; active === 'hmm' ? setHMM(v) : setSig(v); timelineText(); });
$('#play').addEventListener('click', () => {
  playing = true; playT = 0;
  if (active === 'hmm') { hmm.t = 0; hmm.target = 0; } else setSig(0);
});
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.scene)));
$('#open-method').addEventListener('click', () => $('#method').classList.add('open'));
$('#close-method').addEventListener('click', () => $('#method').classList.remove('open'));
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === 'Escape') $('#method').classList.remove('open');
  if (e.key === 'd' || e.key === 'D') $('#fps').hidden = !$('#fps').hidden;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
});

/* ---------- hover ---------- */
const mouse = { x: -1, y: -1, in: false };
canvas.addEventListener('pointermove', (e) => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.in = true; });
canvas.addEventListener('pointerleave', () => { mouse.in = false; });
function pick() {
  if (!mouse.in) return null;
  const w = stageEl.clientWidth, h = stageEl.clientHeight; let best = null, bd = 18 * 18;
  const test = (v, group, id) => { tmpV.copy(v); group.localToWorld(tmpV); tmpV.project(camera); if (tmpV.z > 1) return;
    const x = (tmpV.x * 0.5 + 0.5) * w, y = (-tmpV.y * 0.5 + 0.5) * h, d = (x - mouse.x) ** 2 + (y - mouse.y) ** 2; if (d < bd) { bd = d; best = { id, x, y }; } };
  if (active === 'hmm') hmm.mus.forEach((m, s) => test(m, hmm.group, s));
  else { const f = frames[sg.idx][0]; for (let L = 0; L <= f + 1; L++) for (let i = 0; i < NFt; i++) test(new THREE.Vector3(LX[L], sg.disp[L][i], zOf(LX[L])), sg.group, i); }
  return best;
}
let lastHover = null;
function hoverTick() {
  const p = pick(), id = p ? p.id : null;
  const mats = active === 'hmm' ? [trMat, cloudMat, coreMat] : [sgLineMat, sgPointMat];
  mats.forEach((m) => (m.uniforms.uHover.value = id == null ? -1 : id));
  if (id !== lastHover) { lastHover = id; if (active === 'sig') { sg.hover = id; sigLabels(); } }
  if (!p) { tip.style.opacity = 0; return; }
  let html;
  if (active === 'hmm') {
    const F = hmm.F, m = F.f.mu[id];
    const out = F.T[id].map((q, j) => j === id ? null : [j, q]).filter(Boolean).sort((a, b) => b[1] - a[1])[0];
    html = `<strong style="color:${HC[id]}">${H.labels[id]}</strong>20d return ${sig(m[0])}<br>20d vol ${sig(m[1])}<br>drawdown ${sig(m[2])}<br>stays next day ${(F.T[id][id] * 100).toFixed(1)}%<br>most likely exit → ${H.labels[out[0]]} ${(out[1] * 100).toFixed(1)}%`;
  } else {
    const f = frames[sg.idx][0];
    const ranks = S.folds.slice(0, f + 1).map((_, k) => { const imp = impOf(k + 1, sg.idx); return 1 + imp.filter((v) => v > imp[id]).length; });
    html = `<strong style="color:${FC[S.family[id]]}">${S.features[id]}</strong>${S.families[S.family[id]]}<br>rank by fold ${ranks.map((r) => '#' + r).join(' → ')}<br>importance now ${impOf(f + 1, sg.idx)[id].toFixed(4)}`;
  }
  tip.innerHTML = html; tip.style.opacity = 1;
  const tw = tip.offsetWidth, x = p.x + 16 + tw > stageEl.clientWidth - panelW ? p.x - 16 - tw : p.x + 16;
  tip.style.transform = `translate(${x}px,${p.y - 10}px)`;
}

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  uniformsShared.uTime.value += dt;
  for (const m of [trMat, sgLineMat]) m.uniforms.uTime.value = uniformsShared.uTime.value;
  if (playing) {
    playT += dt;
    if (active === 'hmm') { const v = Math.min(NF - 1, playT / 0.32); hmm.target = v; scrub.value = Math.round(v); timelineText(); if (v >= NF - 1) playing = false; }
    else { const i = Math.min(frames.length - 1, Math.floor(playT / 0.07)); setSig(i); scrub.value = i; if (i >= frames.length - 1) playing = false; }
  }
  if (active === 'hmm') {
    const d = hmm.target - hmm.t;
    if (Math.abs(d) > 0.001) {
      const prevF = hmm.F.f; hmm.t += reduced ? d : d * Math.min(1, dt * 9); if (Math.abs(hmm.target - hmm.t) < 0.002) hmm.t = hmm.target;
      buildHMM(hmm.t); if (hmm.F.f !== prevF) { readHMM(); drawRibbon(); timelineText(); }
      hmmLabels();
    }
    rings.forEach((r) => r.quaternion.copy(camera.quaternion));
  } else { stepSig(); if (!reduced && !controls._busy) sg.group.rotation.y = 0.16 * Math.sin(uniformsShared.uTime.value * 0.11); }
  controls.update();
  hoverTick();
  placeLabels(active === 'hmm' ? hmm.group : sg.group);
  composer.render();
  fpsN++; fpsT += dt; if (fpsT > 1) { $('#fps').textContent = `${Math.round(fpsN / fpsT)} fps`; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}
show(location.hash === '#features' ? 'sig' : 'hmm');
resize(); frame(true);
requestAnimationFrame(loop);
</script>
