name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      FINSIGHT_DATA_DIR: /tmp/finsight-data
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest httpx
      - run: python -m compileall -q backend src tests
      - name: Verify frozen Forge baseline bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("data/exports/forge_v0_2_5_real_baseline")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          bad = [name for name, digest in manifest["artifacts"].items()
                 if hashlib.sha256((root / name).read_bytes()).hexdigest() != digest]
          if bad:
              raise SystemExit("Frozen Forge byte mismatch: " + ", ".join(bad))
          print(f"Verified {len(manifest['artifacts'])} frozen Forge file hashes")
          PY
      - name: Verify frozen Dynamics lineage
        run: |
          python scripts/verify_dynamics_d0_2_1.py
          python scripts/verify_dynamics_d0_3.py
          python scripts/verify_dynamics_d0_3_1.py
          python scripts/verify_dynamics_d0_3_2.py
          python scripts/verify_dynamics_d0_3_2_1.py
          python scripts/verify_dynamics_d0_3_3.py
          python scripts/verify_dynamics_d0_3_3_1.py
          python scripts/verify_dynamics_d0_3_3_2.py
          python scripts/verify_dynamics_d0_3_4.py
          python scripts/verify_dynamics_d0_4.py
          python scripts/verify_dynamics_d0_4_1.py
          python scripts/verify_dynamics_d0_4_1_1.py
          python scripts/verify_dynamics_d0_4_2.py
      - name: Verify release authorship and legal attribution
        run: |
          git config --local user.name "Raghhav Malani"
          git config --local user.email "96712854+RaghhavMalani@users.noreply.github.com"
          python scripts/verify_release_authorship.py
      - name: Verify agent-eval anti-gaming contracts
        run: pytest -q tests/test_agent_eval_metrics.py tests/sabotage
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx eslint src/components/terminal/StockIntelligencePanel.tsx src/components/terminal/MonteCarloPanel.tsx
      - run: npx eslint src/dynamics/EventIdentifiabilityObservatory.tsx src/dynamics/hawkes-identifiability-contracts.ts src/dynamics/DynamicsNavigator.tsx src/dynamics/query.ts
      - run: npx prettier --check src/dynamics/EventIdentifiabilityObservatory.tsx src/dynamics/hawkes-identifiability-contracts.ts src/dynamics/DynamicsNavigator.tsx src/dynamics/query.ts
      - run: npx eslint src/dynamics/BoundaryStructureMicroscope.tsx src/dynamics/hawkes-boundary-contracts.ts
      - run: npx prettier --check src/dynamics/BoundaryStructureMicroscope.tsx src/dynamics/hawkes-boundary-contracts.ts scripts/verify-hawkes-boundary.mjs
      - run: npx tsc --noEmit
      - run: node scripts/verify-hawkes-identifiability.mjs
      - run: node scripts/verify-hawkes-boundary.mjs
      - run: npx eslint src/dynamics/MarketRegimeLab.tsx src/dynamics/RegimeLandscape.tsx src/dynamics/market-regime-contracts.ts
      - run: npx prettier --check src/dynamics/MarketRegimeLab.tsx src/dynamics/RegimeLandscape.tsx src/dynamics/market-regime-contracts.ts scripts/verify-market-regime.mjs
      - run: node scripts/verify-market-regime.mjs
      - run: npx eslint src/dynamics/RegimeProduct.tsx src/dynamics/product-contracts.ts src/dynamics/snapshot-label.ts src/app/shell/ForgeShell.tsx
      - run: npx prettier --check src/dynamics/RegimeProduct.tsx src/dynamics/product-contracts.ts src/dynamics/snapshot-label.ts src/app/shell/ForgeShell.tsx scripts/verify-regime-product.mjs
      - run: node scripts/verify-regime-product.mjs
      - run: node scripts/verify-observatory.mjs
      - run: node scripts/verify-neural.mjs
      - run: npm run build
      - name: Install Chromium for the Observatory browser check
        run: npx playwright install --with-deps --only-shell chromium
      - name: Observatory scene labels never overlap (production preview, software WebGL)
        run: |
          node scripts/preview-built.mjs &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4174/observatory && break; sleep 1; done
          node scripts/verify-observatory.mjs --url http://127.0.0.1:4174

  truth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime databases
        shell: bash
        run: |
          tracked="$(git ls-files '*.db' '*.db-journal' '*.sqlite' '*.sqlite3' '*.sqlite-journal')"
          if [[ -n "$tracked" ]]; then
            echo "Runtime databases must not be committed:"
            echo "$tracked"
            exit 1
          fi
      - name: Reject removed alternative-data theatre
        shell: bash
        run: |
          ! git grep -nE 'parking-lot fill|BACKTESTED ·|Since 2018.*median forward return|fall back silently to sim' -- frontend-v2/src
