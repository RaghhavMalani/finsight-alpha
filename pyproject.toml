[project]
name = "finsight-alpha"
version = "0.1.0"
description = "RL environment and evaluation harness for coding agents, instantiated in finance"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "pandas",
    "numpy",
    "yfinance",
    "scipy",
    "statsmodels>=0.14.6,<0.15",
    "scikit-learn",
    "joblib",
    "hmmlearn",
    "pypdf",
    "python-docx",
    "rank-bm25",
    "tqdm",
    "requests",
    "beautifulsoup4",
    "lxml",
    "urllib3",
    "tldextract",
    "openai",
    "python-dotenv",
    "sqlalchemy",
    "psycopg2-binary",
    "google-cloud-storage",
    "uvicorn",
    "exchange-calendars>=4.13,<5",
    "websocket-client>=1.8,<2",
]

[tool.vercel]
entrypoint = "backend.main:app"
